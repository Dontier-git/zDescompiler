<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#3a1e10"/>
  <!-- Sand/pumpkin top (orange pastel) -->
  <rect x="2" y="2" width="28" height="10" fill="#d99554"/>
  <rect x="2" y="2" width="28" height="2" fill="#f0b87a"/>
  <rect x="2" y="8" width="28" height="4" fill="#b87a3a"/>
  <!-- Terracotta bottom -->
  <rect x="2" y="12" width="28" height="18" fill="#a0612a"/>
  <rect x="4" y="14" width="3" height="3" fill="#c47a35"/>
  <rect x="20" y="16" width="4" height="3" fill="#c47a35"/>
  <rect x="10" y="22" width="3" height="3" fill="#6b3d1a"/>
  <rect x="22" y="22" width="3" height="3" fill="#6b3d1a"/>
  <!-- Z mark -->
  <rect x="10" y="14" width="12" height="2" fill="#ffffff"/>
  <rect x="20" y="16" width="2" height="6" fill="#ffffff"/>
